ruleRequires:
  cashLeftOut: 'Only the cash of the client being served may lie on the desk. Cash accepted earlier is kept in a device that locks with a key.'
  countWithoutClient: 'Incoming cash is counted in the presence of the client. When paying out, the prepared amount is also counted in front of the client.'
  mixedCash: 'Only the cash of the client being served is at the workplace. Amounts under different receipt documents are accepted separately and checked against each document.'
  noRecount: 'When accepting cash, the cashier counts and checks it and matches the amount against the receipt document. When paying out, the prepared amount is counted in front of the client.'
  partialReturn: 'The cashier counts incoming cash in front of the client and matches the amount actually accepted against the receipt document.'
  rejectedNotes: 'The cashier makes sure incoming cash is checked for authenticity and validity. Suspicious banknotes are recorded and sent for examination under a special procedure.'
  noId: 'Before accepting or paying out cash, the cashier identifies the client by an ID document or by data from the digital documents service.'
  safeOpen: 'Cash accepted earlier is kept at the workplace in devices that lock with a key. The bank sets the procedure for handling keys.'
  keyLeft: "The bank's internal documents set how keys to the working safe and drawers, seals and name stamps are kept."
  stampsLeft: 'The bank sets how seals, stamps, sealing tools, keys and codes are stored so that no one can use them without authorisation.'
  personalItems: 'Staff personal items, personal cash and valuables are kept outside the cash unit. Exceptions: medicines, medical devices and phones without photo or video capture.'
  sessionUnlocked: "After more than 30 minutes of inactivity, the system ends the session or locks the workstation. The bank's security policy sets when to lock it immediately."
  doorOpen: 'The cash desk has its own entrance with a door that locks. The cash unit is isolated by a closing service entrance.'
  notReady: 'Tools that check cash authenticity and validity work during cash operations. The cash room has video surveillance and is guarded.'
ruleCheck:
  cashLeftOut: "Whose cash it is: the current client's cash may stay on the desk for counting. A locking drawer or trolley counts instead of a safe."
  countWithoutClient: 'Whether counting went on without the client. If the cashier stopped until the client returned, there is no violation.'
  mixedCash: 'Whether these were different clients, operations or receipt documents, and whether each amount was fully accepted.'
  noRecount: 'Two separate facts: no counting, and the operation not recorded in the system. Check the receipt and the operations log.'
  partialReturn: 'Whether the accepted amount matches the receipt document and why part of the cash went back to the client.'
  rejectedNotes: 'Whether the rejected banknotes went through the required check. If not, the violation is confirmed.'
  noId: 'Whether the client was identified by a digital document and whether the operation went through. A missing plastic ID alone is not a violation.'
  safeOpen: 'Whether the open safe held cash and whether the desk was left unattended. The rule does not require closing an empty safe every minute.'
  keyLeft: "The type of safe and whether an outsider could take the key. A ban on leaving the key in the lock belongs to the bank's internal instructions."
  stampsLeft: "There is no general rule that seals must stay in the safe. Check the bank's rules and whether outsiders had access."
  personalItems: 'Whether the items were inside the cash unit and whether they fall under the allowed exceptions.'
  sessionUnlocked: 'A computer that is on is not yet a violation. Whether the session was unlocked and how long the employee was away.'
  doorOpen: 'An open door on video is not yet a violation. Whether it is the service door and whether anyone entered without authorisation. Para. 16 of Resolution No. 14 is suspended until 01.01.2027.'
  notReady: 'Letting a client in before the equipment is set up is not directly banned. Which devices were off and whether an operation took place.'
