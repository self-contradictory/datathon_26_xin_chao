ruleRequires:
  cashLeftOut: 'На столе могут лежать только деньги клиента, которого обслуживают сейчас. Ранее принятые деньги хранятся в устройстве, которое закрывается на ключ.'
  countWithoutClient: 'Принимаемые деньги пересчитываются в присутствии клиента. При выдаче подготовленная сумма тоже пересчитывается при клиенте.'
  mixedCash: 'На рабочем месте лежат деньги только обслуживаемого клиента. Суммы по разным приходным документам принимаются раздельно и сверяются с каждым документом.'
  noRecount: 'При приёме кассир пересчитывает и проверяет деньги и сверяет сумму с приходным документом. При выдаче подготовленная сумма пересчитывается при клиенте.'
  partialReturn: 'Кассир пересчитывает принимаемые деньги при клиенте и сверяет фактически принятую сумму с приходным документом.'
  rejectedNotes: 'Кассир обеспечивает проверку подлинности и платёжности принимаемых денег. Сомнительные банкноты оформляются и направляются на экспертизу по особому порядку.'
  noId: 'Перед приёмом или выдачей денег кассир идентифицирует клиента по удостоверению личности или по данным сервиса цифровых документов.'
  safeOpen: 'Ранее принятые деньги на рабочем месте хранятся в устройствах, которые закрываются на ключ. Порядок обращения с ключами устанавливает банк.'
  keyLeft: 'Порядок хранения ключей от рабочего сейфа и ящиков, печатей и именных штампов устанавливают внутренние документы банка.'
  stampsLeft: 'Порядок хранения печатей, штампов, пломбираторов, ключей и кодов определяет банк так, чтобы исключить их несанкционированное использование.'
  personalItems: 'Личные вещи, личные деньги и ценности работников хранятся вне кассового узла. Исключения: лекарства, медицинские изделия и средства связи без фото- и видеосъёмки.'
  sessionUnlocked: 'При неактивности дольше 30 минут система сама завершает сеанс или блокирует рабочую станцию. Порядок немедленной блокировки задают правила информационной безопасности банка.'
  doorOpen: 'У кассы отдельный вход с дверью, которая закрывается на замок. Кассовый узел изолирован закрывающимся служебным входом.'
  notReady: 'При кассовых операциях работают средства проверки подлинности и платёжности денег. Кассовое помещение оборудуется видеонаблюдением и охраняется.'
  leftDuringService: 'Кассовый работник не покидает рабочее место, пока не закончит обслуживание клиента.'
  mobilePhone: 'В кассовый узел можно вносить только средства связи без функции фото- и видеофиксации. Личные вещи работников хранятся вне кассового узла.'
ruleCheck:
  cashLeftOut: 'Чьи это деньги: деньги текущего клиента можно держать на столе для пересчёта. Вместо сейфа допускается запираемый ящик или тележка.'
  countWithoutClient: 'Продолжался ли пересчёт без клиента. Если кассир остановился до его возвращения, нарушения нет.'
  mixedCash: 'Были ли это разные клиенты, операции или приходные документы и завершён ли приём каждой суммы.'
  noRecount: 'Два отдельных факта: не было пересчёта и операция не отражена в системе. Сверить чек и операционный журнал.'
  partialReturn: 'Совпадает ли принятая сумма с приходным документом и почему часть денег вернулась клиенту.'
  rejectedNotes: 'Прошли ли отклонённые банкноты необходимую проверку. Если нет, нарушение подтверждается.'
  noId: 'Была ли идентификация по цифровому документу и прошла ли операция. Отсутствие пластикового удостоверения само по себе не нарушение.'
  safeOpen: 'Были ли в открытом сейфе деньги и оставалась ли касса без присмотра. Пустой сейф норма не требует закрывать каждую минуту.'
  keyLeft: 'Тип сейфа и мог ли ключ взять посторонний. Запрет оставлять ключ в замке ищется во внутренней инструкции банка.'
  stampsLeft: 'Общей нормы «печати только в сейфе» нет. Проверить регламент банка и был ли доступ посторонних.'
  personalItems: 'Лежали ли вещи именно в кассовом узле и не относятся ли они к разрешённым исключениям.'
  sessionUnlocked: 'Включённый компьютер ещё не нарушение. Был ли сеанс разблокирован и как долго отсутствовал работник.'
  doorOpen: 'Открытая дверь на кадре ещё не нарушение. Служебная ли это дверь и был ли несанкционированный доступ. Пункт 16 Постановления № 14 приостановлен до 01.01.2027.'
  notReady: 'Сам допуск клиента до настройки техники прямо не запрещён. Какие устройства не работали и прошла ли операция.'
  leftDuringService: 'Был ли клиент у стола в момент ухода кассира и закончилась ли операция. Если клиента уже не было, этот тип не подходит.'
  mobilePhone: 'Был ли это мобильный телефон с камерой, а не стационарный телефон на столе. Телефон без фото- и видеофиксации разрешён.'
