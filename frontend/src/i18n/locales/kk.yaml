ruleRequires:
  cashLeftOut: 'Үстелде тек қазір қызмет көрсетіліп жатқан клиенттің ақшасы ғана жата алады. Бұрын қабылданған ақша кілтпен жабылатын құрылғыда сақталады.'
  countWithoutClient: 'Қабылданатын ақша клиенттің қатысуымен қайта саналады. Беру кезінде дайындалған сома да клиенттің көзінше саналады.'
  mixedCash: 'Жұмыс орнында тек қызмет көрсетіліп жатқан клиенттің ақшасы жатады. Әртүрлі кіріс құжаттары бойынша сомалар бөлек қабылданып, әр құжатпен салыстырылады.'
  noRecount: 'Қабылдау кезінде кассир ақшаны қайта санап, тексереді және соманы кіріс құжатымен салыстырады. Беру кезінде дайындалған сома клиенттің көзінше саналады.'
  partialReturn: 'Кассир қабылданатын ақшаны клиенттің көзінше қайта санап, нақты қабылданған соманы кіріс құжатымен салыстырады.'
  rejectedNotes: 'Кассир қабылданатын ақшаның түпнұсқалығы мен төлемге жарамдылығын тексеруді қамтамасыз етеді. Күмәнді банкноттар ерекше тәртіппен ресімделіп, сараптамаға жіберіледі.'
  noId: 'Ақшаны қабылдау немесе беру алдында кассир клиентті жеке куәлігі немесе цифрлық құжаттар сервисінің деректері бойынша сәйкестендіреді.'
  safeOpen: 'Жұмыс орнындағы бұрын қабылданған ақша кілтпен жабылатын құрылғыларда сақталады. Кілттермен жұмыс тәртібін банк белгілейді.'
  keyLeft: 'Жұмыс сейфі мен жәшіктердің кілттерін, мөрлер мен атаулы мөртаңбаларды сақтау тәртібін банктің ішкі құжаттары белгілейді.'
  stampsLeft: 'Мөрлерді, мөртаңбаларды, пломбираторларды, кілттер мен кодтарды сақтау тәртібін банк оларды рұқсатсыз пайдалануға жол бермейтіндей етіп белгілейді.'
  personalItems: 'Қызметкерлердің жеке заттары, жеке ақшасы және құндылықтары касса торабынан тыс сақталады. Ерекшеліктер: дәрілер, медициналық бұйымдар және фото-бейнетүсірілімсіз байланыс құралдары.'
  sessionUnlocked: '30 минуттан артық белсенділік болмаса, жүйе сеансты өзі аяқтайды немесе жұмыс станциясын бұғаттайды. Дереу бұғаттау тәртібін банктің ақпараттық қауіпсіздік ережелері белгілейді.'
  doorOpen: 'Кассаның құлыппен жабылатын есігі бар жеке кіреберісі болады. Касса торабы жабылатын қызметтік кіреберіспен оқшауланады.'
  notReady: 'Кассалық операциялар кезінде ақшаның түпнұсқалығы мен төлемге жарамдылығын тексеру құралдары жұмыс істейді. Касса үй-жайы бейнебақылаумен жабдықталып, күзетіледі.'
  leftDuringService: 'Кассалық қызметкер клиентке қызмет көрсетуді аяқтағанша жұмыс орнын тастап кетпейді.'
ruleCheck:
  cashLeftOut: 'Бұл кімнің ақшасы: ағымдағы клиенттің ақшасын санау үшін үстелде ұстауға болады. Сейфтің орнына құлыпталатын жәшік немесе арба да жарайды.'
  countWithoutClient: 'Санау клиентсіз жалғасты ма. Кассир клиент оралғанша тоқтаса, бұзушылық жоқ.'
  mixedCash: 'Бұлар әртүрлі клиенттер, операциялар немесе кіріс құжаттары ма және әр соманы қабылдау аяқталды ма.'
  noRecount: 'Екі бөлек факт: қайта санау болмады және операция жүйеде көрсетілмеді. Чек пен операциялық журналды салыстыру керек.'
  partialReturn: 'Қабылданған сома кіріс құжатымен сәйкес пе және ақшаның бір бөлігі клиентке неге қайтарылды.'
  rejectedNotes: 'Қабылданбаған банкноттар қажетті тексеруден өтті ме. Өтпесе, бұзушылық расталады.'
  noId: 'Цифрлық құжат бойынша сәйкестендіру болды ма және операция өтті ме. Пластик куәліктің болмауы өз алдына бұзушылық емес.'
  safeOpen: 'Ашық сейфте ақша болды ма және касса қараусыз қалды ма. Норма бос сейфті әр минут сайын жабуды талап етпейді.'
  keyLeft: 'Сейфтің түрі және кілтті бөгде адам ала алды ма. Кілтті құлыпта қалдыруға тыйым банктің ішкі нұсқаулығында болуы керек.'
  stampsLeft: '«Мөрлер тек сейфте» деген жалпы норма жоқ. Банк регламентін және бөгде адамдардың қолы жетті ме, соны тексеру керек.'
  personalItems: 'Заттар дәл касса торабында жатты ма және рұқсат етілген ерекшеліктерге жатпай ма.'
  sessionUnlocked: 'Қосулы компьютер әлі бұзушылық емес. Сеанс бұғатталмаған ба және қызметкер қанша уақыт болмады.'
  doorOpen: 'Кадрдағы ашық есік әлі бұзушылық емес. Бұл қызметтік есік пе және рұқсатсыз кіру болды ма. № 14 қаулының 16-тармағы 01.01.2027 дейін тоқтатылған.'
  notReady: 'Клиентті техниканы баптағанға дейін кіргізуге тікелей тыйым жоқ. Қандай құрылғылар жұмыс істемеді және операция өтті ме.'
  leftDuringService: 'Кассир кеткен сәтте клиент үстел басында болды ма және операция аяқталды ма. Клиент кетіп қалған болса, бұл түр сәйкес келмейді.'
