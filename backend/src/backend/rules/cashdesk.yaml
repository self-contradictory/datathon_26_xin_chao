    other:
      kind: state
      property: unattended
      entity:
        kind: zone
        subtype: cash_room
      value: 'true'
      knowledge: bounded_by_observations
    relation: overlaps
  evidence_policy: *policy
  dataset_examples: [Х-24]
  implementation_note: ''

- rule_id: CD09-DOOR-OPEN-UNATTENDED
  version: 0.1.0
  status: candidate
  type: MUTUAL_EXCLUSION
  name: Cash room door open while the room is unattended
  category: door_open_unattended
  source:
    kind: regulatory_candidate
    document: &npa14 Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой (постановление Правления НБРК от 24.02.2020 № 14)
    clause: п. 16 пп. 1); п. 8
    url: &url14 https://adilet.zan.kz/rus/docs/V2000020075
    verified: false
    note: Касса имеет отдельный вход с дверью, закрывающейся на замок; кассовый узел изолирован закрывающимся служебным входом. Открытая дверь на кадре сама по себе нарушение не доказывает — установить, служебная ли дверь и был ли посторонний доступ.
  scope:
    kind: video
  trigger:
    kind: state
    property: open
    entity:
      kind: object
      subtype: entrance_door
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: MUTUAL_EXCLUSION
    other:
      kind: state
      property: unattended
      entity:
        kind: zone
        subtype: cash_room
      value: 'true'
      knowledge: bounded_by_observations
    relation: overlaps
  evidence_policy: *policy
  dataset_examples: [Х-32, Х-33]
  implementation_note: ''

