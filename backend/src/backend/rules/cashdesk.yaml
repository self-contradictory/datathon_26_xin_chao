schema_version: steg-rule-dsl/1.0.0
required_steg_schema_version: 1.0.0
registry_id: cashdesk-npa-rk-2026
rules:
- rule_id: CD01-CUSTOMER-ABSENT-DURING-COUNT
  version: 0.1.0
  status: candidate
  type: DURING
  name: Cash counted while the customer is away from the desk
  category: customer_absent_during_count
  source:
    kind: regulatory_candidate
    document: &npa231 Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей (постановление Правления НБРК от 29.11.2019 № 231)
    clause: п. 20; п. 31 пп. 4); п. 35
    url: &url231 https://adilet.zan.kz/rus/docs/V1900019680
    verified: false
    note: Принимаемые наличные пересчитываются в присутствии клиента (п. 20); при выдаче кассир пересчитывает подготовленную сумму в присутствии клиента (п. 31 пп. 4), п. 35). Если кассир остановил пересчёт до возвращения клиента, нарушения нет.
  scope:
    kind: episode
    episode_kind: customer_visit
    bind: $visit
    episode_roles:
      customer: $customer
  trigger:
    kind: event
    action: cash_counted
    participants:
      cashier: $cashier
  logic:
    type: DURING
    required:
      kind: state
      property: at_cash_counter
      entity: $customer
      value: 'true'
      knowledge: bounded_by_observations
    interval: entire_trigger_interval
  evidence_policy: &policy
    allow_hypotheses: false
    allow_disputed: false
    negative_evidence: requires_explicit_bounded_false_or_proven_completeness
    on_missing_binding: UNKNOWN
    on_ambiguous_role: UNKNOWN
    on_incomplete_episode: UNKNOWN
    max_evidence_frames: 3
  dataset_examples: [Х-34, Х-38]
  implementation_note: The customer's at_cash_counter state is false only where the customer side of the desk is seen empty, so a customer hidden behind the cashier stays unknown rather than absent.

- rule_id: CD02-CASH-ON-DESK-AT-CUSTOMER-ARRIVAL
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Banknotes already on the desk when the next customer arrives
  category: prior_cash_on_desk
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 20
    url: *url231
    verified: false
    note: На рабочем месте кассира находятся деньги только обслуживаемого клиента; суммы, принятые ранее, размещаются в запираемом устройстве хранения (ящик, тележка, сейф). Проверить, были ли деньги приняты от предыдущего клиента.
  scope:
    kind: video
  trigger:
    kind: event
    action: customer_arrives
    participants:
      customer: $customer
  logic:
    type: FORBIDDEN
    when_all:
    - kind: state
      property: banknotes_visible
      entity:
        kind: object
        subtype: cashier_desk
      value: 'true'
      knowledge: bounded_by_observations
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-4, Х-18, Х-26, Х-38, Х-47]
  implementation_note: Banknotes must be seen on the desk over the whole uncertainty window of the arrival. The pipeline starts a new customer entity for every visit, so a customer who returns mid-transaction looks like a new customer.

- rule_id: CD03-CASH-ON-UNATTENDED-DESK
  version: 0.1.0
  status: candidate
  type: MUTUAL_EXCLUSION
  name: Banknotes left on the desk while the cash room is unattended
  category: cash_left_unattended
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 20; п. 22
    url: *url231
    verified: false
    note: Ранее принятые деньги размещаются в запираемом устройстве хранения (п. 20); кассир не покидает рабочее место до завершения обслуживания (п. 22).
  scope:
    kind: video
  trigger:
    kind: state
    property: banknotes_visible
    entity:
      kind: object
      subtype: cashier_desk
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: MUTUAL_EXCLUSION
    other:
      kind: state
      property: unattended
      entity:
        kind: zone
        subtype: cash_room
      value: 'true'
      knowledge: bounded_by_observations
    relation: overlaps
  evidence_policy: *policy
  dataset_examples: [Х-4, Х-26]
  implementation_note: The room counts as unattended only while it is seen empty.

- rule_id: CD04-BAG-ON-UNATTENDED-DESK
  version: 0.1.0
