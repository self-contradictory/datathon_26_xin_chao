  type: MUTUAL_EXCLUSION
  name: Bag or package left on the desk while the cash room is unattended
  category: cash_bag_left_unattended
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 20; п. 22
    url: *url231
    verified: false
    note: Пакет или сумка с ранее принятыми наличными на рабочем месте; на столе могут быть только наличные обслуживаемого клиента. Содержимое сумки по видео не устанавливается.
  scope:
    kind: video
  trigger:
    kind: state
    property: bag_visible
    entity:
      kind: object
      subtype: cashier_desk
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: MUTUAL_EXCLUSION
    other:
      kind: state
      property: unattended
      entity:
        kind: zone
        subtype: cash_room
      value: 'true'
      knowledge: bounded_by_observations
    relation: overlaps
  evidence_policy: *policy
  dataset_examples: [Х-15]
  implementation_note: The video shows a bag, not what is inside it; the description must say so.

- rule_id: CD05-SAFE-OPEN-UNATTENDED
  version: 0.1.0
  status: candidate
  type: MUTUAL_EXCLUSION
  name: Safe left open while the cash room is unattended
  category: safe_open_unattended
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 20; п. 80
    url: *url231
    verified: false
    note: Ранее принятые наличные хранятся в устройствах, закрываемых на ключ (п. 20); порядок обращения с ключами устанавливает банк (п. 80). Выяснить, были ли в открытом сейфе деньги — п. 20 не требует закрывать пустой сейф.
  scope:
    kind: video
  trigger:
    kind: state
    property: open
    entity:
      kind: object
      subtype: safe
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: MUTUAL_EXCLUSION
    other:
      kind: state
      property: unattended
      entity:
        kind: zone
        subtype: cash_room
      value: 'true'
      knowledge: bounded_by_observations
    relation: overlaps
  evidence_policy: *policy
  dataset_examples: [Х-20]
  implementation_note: Weaker than R09-MUTUAL_EXCLUSION, which also needs the safe to be seen holding cash; the pipeline cannot see the safe's contents.

- rule_id: CD06-KEY-IN-SAFE-UNATTENDED
  version: 0.1.0
  status: candidate
  type: MUTUAL_EXCLUSION
  name: Key left in the safe lock while the cash room is unattended
  category: safe_key_left_unattended
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 80; п. 76
    url: *url231
    verified: false
    note: Порядок использования и хранения ключей рабочего сейфа устанавливается внутренними документами банка во исполнение п. 80; ключи кладовой и сейфовой комнаты находятся у ответственных лиц (п. 76). Уточнить тип сейфа и доступность ключа посторонним.
  scope:
    kind: video
  trigger:
    kind: state
    property: key_in_lock
    entity:
      kind: object
      subtype: safe
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: MUTUAL_EXCLUSION
    other:
      kind: state
      property: unattended
      entity:
        kind: zone
        subtype: cash_room
      value: 'true'
      knowledge: bounded_by_observations
    relation: overlaps
  evidence_policy: *policy
  dataset_examples: [Х-22]
  implementation_note: Dataset example Х-46. Evaluate eating and exposed banknotes independently; food alone does not trigger this rule. This is a cash-security candidate, not a general legal ban on eating.

- rule_id: CD07-COMPUTER-ON-UNATTENDED
  version: 0.1.0
  status: candidate
  type: MUTUAL_EXCLUSION
  name: Computer screen left on while the cash room is unattended
  category: workstation_left_unlocked
  source:
    kind: regulatory_candidate
    document: Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций (постановление Правления АРРФР от 03.04.2026 № 53)
    clause: п. 71 пп. 9); пп. 53, 106
    url: https://adilet.zan.kz/rus/docs/V2600038336
    verified: false
    note: Система должна завершать сеанс или блокировать рабочую станцию при неактивности более 30 минут; порядок немедленной блокировки при уходе задаёт политика ИБ банка. Включённый экран не доказывает, что сеанс разблокирован.
  scope:
    kind: video
  trigger:
    kind: state
    property: unlocked_session_visible
    entity:
      kind: object
      subtype: computer
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: MUTUAL_EXCLUSION
    other:
      kind: state
      property: unattended
      entity:
        kind: zone
        subtype: cash_room
      value: 'true'
      knowledge: bounded_by_observations
    relation: overlaps
  evidence_policy: *policy
  dataset_examples: [Х-11, Х-28]
  implementation_note: Triggers on a screen that shows an open document or program window (zoomed laptop crop), not on any lit screen, so a visible lock screen does not trigger it. Whether the session itself was locked is still outside the video.

