- rule_id: CD11-SERVICE-BEFORE-EQUIPMENT-READY
  version: 0.1.0
  status: disabled
  type: FORBIDDEN
  name: Customer served while the computer is still off
  category: service_before_equipment_ready
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 9
    url: *url231
    verified: false
    note: Рабочее место кассира обеспечивается средствами и оборудованием для кассовых операций и контроля банкнот (п. 9; см. также Правила № 14, п. 16 пп. 6)). Один лишь допуск клиента до включения техники прямо не запрещён — проверить, проводилась ли операция.
  scope:
    kind: video
  trigger:
    kind: event
    action: customer_arrives
    participants:
      customer: $customer
  logic:
    type: FORBIDDEN
    when_all:
    - kind: state
      property: screen_on
      entity:
        kind: object
        subtype: computer
      value: 'false'
      knowledge: bounded_by_observations
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-30]
  implementation_note: Disabled. In the no-violation video Х-19 the laptop screen is dark when the customer arrives and is woken later, so a dark screen at arrival does not separate the labelled cases. CD11B checks whether the cashier is still setting up instead.

- rule_id: CD12-IDENTIFICATION-BEFORE-CASH-HANDLING
  version: 0.1.0
  status: candidate
  type: PROCEDURE
  name: Customer identification not seen before the cash is counted
  category: customer_not_identified
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 7; п. 19 пп. 1); п. 31 пп. 1)
    url: *url231
    verified: false
    note: Кассир идентифицирует клиента по удостоверяющему документу или по сведениям сервиса цифровых документов (п. 19 пп. 1), п. 31 пп. 1); Закон РК № 191-IV, ст. 5). Отсутствие пластикового удостоверения само по себе не нарушение.
  scope:
    kind: episode
    episode_kind: customer_visit
    bind: $visit
    episode_roles:
      cashier: $cashier
  trigger:
    kind: episode
    episode_kind: customer_visit
  logic:
    type: PROCEDURE
    steps:
    - id: identity
      required: true
      any_of:
      - kind: event
        action: physical_id_checked
      - kind: event
        action: digital_id_checked
      omission_observability: external_or_positively_verified_coverage
    - id: count
      required: false
      any_of:
      - kind: event
        action: cash_counted
        participants:
          cashier: $cashier
    order_constraints:
    - before: identity
      after: count
    end_boundary: observed
    step_absence_default: UNKNOWN_unless_negation_proven
  evidence_policy: *policy
  dataset_examples: [X-2, Х-17, Х-18]
  implementation_note: A digital ID check happens on the computer and is never visible, so a missing identity step stays UNKNOWN (not_observed); the reporting policy decides whether to surface it.

- rule_id: CD13-COUNT-DURING-VISIT
  version: 0.1.0
  status: candidate
  type: REQUIRED_ACTION
  name: No cash count seen during a customer visit
  category: cash_not_counted
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 19 пп. 2), 4); п. 20
    url: *url231
    verified: false
    note: При приёме кассир пересчитывает банкноты и сверяет фактически принятую сумму с приходным кассовым документом. Отражение операции в системе по видео не проверяется.
  scope:
    kind: episode
    episode_kind: customer_visit
    bind: $visit
    episode_roles:
      cashier: $cashier
  trigger:
    kind: event
    action: customer_arrives
    participants:
      customer: $customer
  logic:
    type: REQUIRED_ACTION
    must:
      kind: event
      action: cash_counted
      participants:
        cashier: $cashier
    deadline:
      kind: episode_end
      requires_end_boundary: observed
    order: after_trigger_before_boundary
  evidence_policy: *policy
  dataset_examples: [Х-13]
  implementation_note: Assumes every visit involves cash. A visit without a cash operation reads as a missing count.

- rule_id: CD14-PERSONAL-ITEMS-IN-CASH-ROOM
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Personal belongings kept at the cashier's workplace
  category: personal_items_in_cash_room
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 12
    url: *url231
    verified: false
    note: Личные вещи, собственные наличные деньги и ценности работника хранятся вне кассового узла; исключения — лекарства, медизделия и средства связи без фото- и видеосъёмки.
  scope:
    kind: video
  trigger:
    kind: state
    property: personal_item_visible
    entity:
      kind: object
      subtype: cashier_desk
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: FORBIDDEN
    when_all:
    - kind: state
      property: occupied
      entity:
        kind: zone
        subtype: customer_side_of_desk
      value: 'false'
      knowledge: bounded_by_observations
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-40]
  implementation_note: The VLM is asked about a handbag, purse, wallet, coat or jacket, not a phone, because phones without a camera are an allowed exception. A bag that appears while a customer is at the desk is treated as the customer's, so the rule needs the customer side of the desk to be seen empty.

- rule_id: CD15-EATING-WITH-CASH-EXPOSED
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Cashier eats or drinks while banknotes lie on the desk
  category: cash_exposed_during_break
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 20
    url: *url231
    verified: false
    note: Ранее принятые деньги хранятся в запираемом устройстве. Запрет приёма пищи на рабочем месте нормой не установлен — нарушение касается денег, оставленных при прерывании операции.
  scope:
    kind: video
  trigger:
    kind: event
    action: cashier_eats
    participants:
      cashier: $cashier
  logic:
    type: FORBIDDEN
    when_all:
    - kind: state
      property: banknotes_visible
      entity:
        kind: object
        subtype: cashier_desk
      value: 'true'
      knowledge: bounded_by_observations
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-46]
  implementation_note: ''

- rule_id: CD16-CASHIER-LEAVES-DURING-SERVICE
  version: 0.1.0
  status: disabled
  type: FORBIDDEN
  name: Cashier leaves the workplace while a customer is being served
  category: cashier_left_active_service
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 22
    url: *url231
    verified: false
    note: Кассиру не следует покидать рабочее место до завершения обслуживания клиента. Норма касается ухода кассира, а не клиента.
  scope:
    kind: video
  trigger:
    kind: event
    action: cashier_leaves_station
    participants:
      cashier: $cashier
  logic:
    type: FORBIDDEN
    when_all:
    - kind: state
      property: customer_service_active
      entity: $cashier
      value: 'true'
      knowledge: bounded_by_observations
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-15]
  implementation_note: Disabled. Same logic as R01-FORBIDDEN. Standing up to reach the safe or the counting machine reads as leaving the station, and in the labelled no-violation visits (Х-5, Х-35, Х-37, Х-39, Х-48) the cashier does exactly that during service. The cited example Х-15 has no customer, so the rule never matched a label.

- rule_id: CD17-COUNTED-CASH-HANDED-BACK
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Part of the accepted and counted cash handed back to the customer
  category: counted_cash_returned
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 19 пп. 2), 4); п. 20
    url: *url231
    verified: false
    note: Кассир пересчитывает принимаемые наличные и сверяет фактически принятую сумму с приходным кассовым документом. Требует проверки обстоятельств — возврат может быть сдачей или возвратом неплатёжных банкнот.
  scope:
    kind: episode
    episode_kind: customer_visit
    bind: $visit
  trigger:
    kind: event
    action: cash_given_to_customer
    participants:
      customer: $customer
  logic:
    type: FORBIDDEN
    when_all:
    - kind: state
      property: received_cash_counted
      entity: $customer
      value: 'true'
      knowledge: bounded_by_observations
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [X-1]
  implementation_note: received_cash_counted turns true once the customer has handed banknotes in and the cashier has counted after that. Change and returned unfit banknotes look the same on video.

- rule_id: CD18-REJECTED-BANKNOTES-RECOMBINED
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Machine-rejected banknotes recombined with the accepted stack without a visible check
  category: rejected_banknotes_recombined
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 19 пп. 2); п. 57; п. 59 при подтверждении сомнительности
    url: *url231
    verified: false
    note: По строке 21 листа «Наблюдения и нормы» предоставленного XLSM. Требует проверки обстоятельств. Отклонение счётной машиной не доказывает подделку; подтвердить проверку подлинности и платёжности и дальнейшее обращение с банкнотами.
  scope:
    kind: video
  trigger:
    kind: event
    action: rejected_banknotes_recombined
    participants:
      cashier: $cashier
  logic:
    type: FORBIDDEN
    when_all: []
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-44]
  implementation_note: Temporal VLM evidence must show machine rejection and recombination. A visible inspection makes this trigger inapplicable; ambiguous rejection, provenance, or inspection stays a hypothesis. This video-only candidate does not establish counterfeit currency or a legal conclusion.

- rule_id: CD19-DIFFERENT-CUSTOMER-CASH-MIXED
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Banknotes from different customer operations mixed together
  category: different_customer_cash_mixed
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 20; п. 19 пп. 2), 4); п. 21 при нескольких приходных документах
    url: *url231
    verified: false
    note: По строке 23 листа «Наблюдения и нормы» предоставленного XLSM. Подтвердить происхождение сумм от разных клиентов или операций и момент смешения; обычное объединение пачек одного клиента не удовлетворяет правилу.
  scope:
    kind: video
  trigger:
    kind: event
    action: different_customer_cash_mixed
    participants:
      cashier: $cashier
  logic:
    type: FORBIDDEN
    when_all: []
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-47]
  implementation_note: A temporal check includes earlier cash-receipt evidence when available. Two piles alone do not establish different owners. If origins are occluded or unobserved, the event is a hypothesis rather than a confirmed trigger.

- rule_id: CD20-CASH-OPERATION-NOT-RECORDED
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Accepted cash operation confirmed absent from the required accounting records
  category: cash_operation_not_recorded
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 26; п. 74 при хранении после учёта
    url: *url231
    verified: false
    note: По строке 6 листа «Наблюдения и нормы» предоставленного XLSM. Проверить чек, операционный журнал и применимый срок. Отсутствие набора текста на ноутбуке не доказывает отсутствие учёта.
  scope:
    kind: video
  trigger:
    kind: event
    action: cash_operation_not_recorded
    participants:
      cashier: $cashier
  logic:
    type: FORBIDDEN
    when_all: []
    at: trigger_start
  evidence_policy:
    <<: *policy
    required_verification: human_confirmed
  dataset_examples: [Х-13]
  implementation_note: External-evidence-only rule. The video observer must never infer this event from missing laptop use. An accounting-system or human-confirmed record is needed. The separately observable missing-count component remains CD13.

- rule_id: CD05B-SAFE-LEFT-OPEN
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Safe left open while nobody is at it
  category: safe_left_open
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 20; п. 80
    url: *url231
    verified: false
    note: Ранее принятые наличные хранятся в устройствах, закрываемых на ключ (п. 20). Сейф открыт, а у сейфа никого нет дольше нескольких секунд — кассир отошёл, не закрыв его. Выяснить, были ли в сейфе деньги.
  scope:
    kind: video
  trigger:
    kind: state
    property: left_open
    entity:
      kind: object
      subtype: safe
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: FORBIDDEN
    when_all: []
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-20]
  implementation_note: left_open is derived from safe open and nobody at the safe for at least LEFT_OPEN_SEC (derived.py). Unlike CD05 it does not require the whole room to be empty.

- rule_id: CD09B-DOOR-LEFT-OPEN
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Cash room door left open with nobody passing through
  category: door_left_open
  source:
    kind: regulatory_candidate
    document: *npa14
    clause: п. 16 пп. 1); п. 8
    url: *url14
    verified: false
    note: Касса имеет отдельный вход с дверью, закрывающейся на замок; кассовый узел изолирован. Дверь остаётся открытой после прохода, хотя через неё никто не проходит. Установить, служебная ли это дверь.
  scope:
    kind: video
  trigger:
    kind: state
    property: left_open
    entity:
      kind: object
      subtype: entrance_door
    value: 'true'
    knowledge: bounded_by_observations
  logic:
    type: FORBIDDEN
    when_all: []
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-32, Х-33]
  implementation_note: left_open is derived from door open and nobody in the doorway for at least LEFT_OPEN_SEC (derived.py). CD09 and CD10 additionally need an empty room or exposed cash.

- rule_id: CD11B-CUSTOMER-ADMITTED-BEFORE-STATION-READY
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Customer admitted while the cashier is still away from the seated workstation
  category: service_before_station_ready
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 9
    url: *url231
    verified: false
    note: Рабочее место кассира обеспечивается оборудованием для кассовых операций (п. 9). Клиент входит, пока кассир ещё стоит и настраивает оборудование. Проверить, готово ли было рабочее место.
  scope:
    kind: video
  trigger:
    kind: event
    action: customer_arrives
    participants:
      customer: $customer
      cashier: $cashier
  logic:
    type: FORBIDDEN
    when_all:
    - kind: state
      property: seated_at_desk
      entity: $cashier
      value: 'false'
      knowledge: bounded_by_observations
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: [Х-30]
  implementation_note: Standing at the arrival is a proxy for equipment set-up still in progress; a cashier returning from the safe also reads as not ready.

- rule_id: CD25-MOBILE-PHONE-IN-CASH-ROOM
  version: 0.1.0
  status: candidate
  type: FORBIDDEN
  name: Cashier uses a mobile phone in the cash room
  category: mobile_phone_in_cash_room
  source:
    kind: regulatory_candidate
    document: *npa231
    clause: п. 12
    url: *url231
    verified: false
    note: «Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка. Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации.» Смартфон имеет камеру, поэтому под исключение не подпадает.
  scope:
    kind: video
  trigger:
    kind: event
    action: cashier_uses_phone
    participants:
      cashier: $cashier
  logic:
    type: FORBIDDEN
    when_all: []
    at: trigger_start
  evidence_policy: *policy
  dataset_examples: []
  implementation_note: General rule with no dataset example. Uses the existing phone probe, so it adds no model calls. The probe asks about a mobile phone, not the desk telephone; a camera cannot be confirmed on video, so the finding assumes a smartphone.
