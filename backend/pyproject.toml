[project]
name = "backend"
version = "0.1.0"
description = "Backend for the Xin Chao Datathon 2026 project"
authors = [
    { name = "^^", email = "178708012+self-contradictory@users.noreply.github.com" }
]
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.1",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
